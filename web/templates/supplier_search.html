{% extends "base.html" %}
{% block title %}Supplier Report — CDP{% endblock %}
{% set active = "supplier" %}

{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-sm-10 col-md-7 col-lg-5">
    <h4 class="mb-4">Supplier Report</h4>
    <form method="get" action="/supplier" autocomplete="off" id="supplier-form">

      <div id="chips-container" class="d-flex flex-wrap gap-2 mb-2"></div>
      <div id="hidden-inputs"></div>

      <div class="mb-2 position-relative">
        <label class="form-label" id="supplier-label">Supplier Name</label>
        <input
          type="text"
          id="supplier-input"
          class="form-control form-control-lg"
          placeholder="Search and select one or more names…"
          autocomplete="off"
        >
        <ul id="supplier-dropdown" class="list-group shadow position-absolute w-100 mt-1"
            style="z-index:1000; display:none; max-height:320px; overflow-y:auto;"></ul>
      </div>

      <div id="form-error" class="alert alert-warning d-none mb-3">
        Please select at least one supplier name.
      </div>

      <button type="submit" class="btn btn-dark btn-lg w-100">Generate Report</button>
    </form>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const input     = document.getElementById('supplier-input');
const dropdown  = document.getElementById('supplier-dropdown');
const chipsEl   = document.getElementById('chips-container');
const hiddenEl  = document.getElementById('hidden-inputs');
const formError = document.getElementById('form-error');

let selectedNames = [];
let lastItems = [];
let timer;

function renderDropdown(items) {
  lastItems = items;
  dropdown.innerHTML = '';
  if (!items.length) { dropdown.style.display = 'none'; return; }
  items.forEach(item => {
    const already = selectedNames.includes(item.name);
    const li = document.createElement('li');
    li.className = already
      ? 'list-group-item d-flex justify-content-between align-items-center py-2 px-3 bg-light'
      : 'list-group-item list-group-item-action d-flex justify-content-between align-items-center py-2 px-3';
    li.style.cursor = already ? 'default' : 'pointer';
    li.innerHTML = `<span class="small text-truncate me-2${already ? ' text-muted' : ''}">${item.name}</span>`
                 + `<span class="d-flex align-items-center gap-2 flex-shrink-0">`
                 + (already ? `<span class="text-success fw-semibold small">&#10003;</span>` : '')
                 + `<span class="badge bg-light text-secondary border" style="font-size:0.7rem;">${item.count.toLocaleString()} notices</span>`
                 + `</span>`;
    if (!already) {
      li.addEventListener('mousedown', e => {
        e.preventDefault();
        addName(item.name);
      });
    }
    dropdown.appendChild(li);
  });
  dropdown.style.display = 'block';
}

function addName(name) {
  if (selectedNames.includes(name)) return;
  selectedNames.push(name);
  renderDropdown(lastItems);

  const chip = document.createElement('span');
  chip.className = 'badge bg-dark d-inline-flex align-items-center gap-1 px-2 py-2';
  chip.style.fontSize = '0.82rem';
  chip.dataset.name = name;
  chip.innerHTML = `<span>${name}</span>`
    + `<button type="button" class="btn-close btn-close-white ms-1" style="font-size:0.5rem;" aria-label="Remove"></button>`;
  chip.querySelector('button').addEventListener('click', () => removeName(name));
  chipsEl.appendChild(chip);

  const hi = document.createElement('input');
  hi.type = 'hidden';
  hi.name = 'name';
  hi.value = name;
  hi.dataset.nameKey = name;
  hiddenEl.appendChild(hi);

  formError.classList.add('d-none');
}

function removeName(name) {
  selectedNames = selectedNames.filter(n => n !== name);
  chipsEl.querySelectorAll('[data-name]').forEach(c => { if (c.dataset.name === name) c.remove(); });
  hiddenEl.querySelectorAll('[data-name-key]').forEach(h => { if (h.dataset.nameKey === name) h.remove(); });
}

async function fetchSuggestions(q) {
  const res   = await fetch(`/api/supplier-suggest?q=${encodeURIComponent(q)}&limit=10`);
  const items = await res.json();
  renderDropdown(items);
}

input.addEventListener('input', () => {
  clearTimeout(timer);
  const q = input.value.trim();
  if (q.length < 2) { dropdown.style.display = 'none'; return; }
  timer = setTimeout(() => fetchSuggestions(q), 180);
});

document.addEventListener('click', e => {
  if (!input.contains(e.target) && !dropdown.contains(e.target))
    dropdown.style.display = 'none';
});

document.getElementById('supplier-form').addEventListener('submit', e => {
  if (selectedNames.length === 0) {
    e.preventDefault();
    formError.classList.remove('d-none');
    input.focus();
  }
});
</script>
{% endblock %}
