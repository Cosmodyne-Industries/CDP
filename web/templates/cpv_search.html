{% extends "base.html" %}
{% block title %}Category Report — CDP{% endblock %}
{% set active = "cpv" %}

{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-sm-10 col-md-7 col-lg-5">
    <h4 class="mb-4">Category Report</h4>
    <form method="get" action="/cpv" autocomplete="off">

      <div class="mb-3 position-relative">
        <label class="form-label">CPV Code</label>
        <input
          type="text"
          name="code"
          id="cpv-input"
          class="form-control form-control-lg"
          placeholder="e.g. 79710000 or type a description…"
        >
        <ul id="cpv-dropdown" class="list-group shadow position-absolute w-100 mt-1" style="z-index:1000; display:none; max-height:320px; overflow-y:auto;"></ul>
      </div>

      <div class="mb-2">
        <input type="text" name="kw1" class="form-control"
               value="{{ kw1 or '' }}"
               placeholder='Keywords e.g. managed print "on-site support"'>
      </div>

      <div class="mb-2 text-center">
        <button type="button" id="op-toggle" class="btn btn-sm btn-outline-secondary"
                style="min-width:80px;" data-op="{{ op or 'and' }}">
          <span id="op-and" {% if (op or 'and') != 'and' %}style="opacity:0.35;"{% endif %}>AND</span>
          <span class="text-muted mx-1">/</span>
          <span id="op-or" {% if (op or 'and') != 'or' %}style="opacity:0.35;"{% endif %}>OR</span>
        </button>
        <input type="hidden" name="op" id="op-hidden" value="{{ op or 'and' }}">
      </div>

      <div class="mb-4">
        <input type="text" name="kw2" class="form-control"
               value="{{ kw2 or '' }}"
               placeholder='Keywords e.g. security "door access"'>
      </div>

      <div class="mb-4">
        <div class="form-check form-switch">
          <input class="form-check-input" type="checkbox" id="sub-check" name="sub-check">
          <label class="form-check-label" for="sub-check">Include sub-codes</label>
        </div>
        <input type="hidden" name="sub" id="sub-hidden" value="{{ 'true' if sub else 'false' }}">
      </div>

      <button type="submit" class="btn btn-dark btn-lg w-100">Generate Report</button>
    </form>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
// CPV autocomplete
const input = document.getElementById('cpv-input');
const dropdown = document.getElementById('cpv-dropdown');
let debounce;

input.addEventListener('input', () => {
  clearTimeout(debounce);
  const q = input.value.trim();
  if (q.length < 2) { dropdown.style.display = 'none'; return; }
  debounce = setTimeout(() => fetchSuggestions(q), 180);
});

async function fetchSuggestions(q) {
  const res = await fetch(`/api/cpv-suggest?q=${encodeURIComponent(q)}`);
  const items = await res.json();
  dropdown.innerHTML = '';
  if (!items.length) { dropdown.style.display = 'none'; return; }
  items.forEach(item => {
    const li = document.createElement('li');
    li.className = 'list-group-item list-group-item-action d-flex justify-content-between align-items-start py-2';
    li.innerHTML = `
      <div>
        <span class="fw-semibold font-monospace">${item.code}</span>
        <span class="text-muted ms-2 small">${item.description}</span>
      </div>
      <span class="badge bg-secondary rounded-pill ms-2">${item.count.toLocaleString()}</span>`;
    li.addEventListener('mousedown', () => {
      input.value = item.code;
      dropdown.style.display = 'none';
    });
    dropdown.appendChild(li);
  });
  dropdown.style.display = 'block';
}

document.addEventListener('click', e => {
  if (!input.contains(e.target)) dropdown.style.display = 'none';
});

// AND/OR toggle
const opToggle = document.getElementById('op-toggle');
const opHidden = document.getElementById('op-hidden');
opToggle.addEventListener('click', () => {
  const next = opHidden.value === 'and' ? 'or' : 'and';
  opHidden.value = next;
  opToggle.dataset.op = next;
  document.getElementById('op-and').style.opacity = next === 'and' ? '1' : '0.35';
  document.getElementById('op-or').style.opacity = next === 'or' ? '1' : '0.35';
});

// Sub-codes toggle
const subCheck = document.getElementById('sub-check');
const subHidden = document.getElementById('sub-hidden');
subCheck.checked = subHidden.value === 'true';
subCheck.addEventListener('change', () => {
  subHidden.value = subCheck.checked ? 'true' : 'false';
});
</script>
{% endblock %}
