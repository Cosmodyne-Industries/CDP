<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Procurement Intelligence{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid position-relative">
    <a class="navbar-brand fw-semibold" href="/">CDP <small class="text-secondary fw-normal fs-6 ms-1">Cosmo's Digital Platform</small></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav navbar-center-nav">
        <li class="nav-item">
          <a class="nav-link {% if active == 'search' %}active{% endif %}" href="/search">Notice Search</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if active == 'cpv' %}active{% endif %}" href="/cpv">Category Report</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if active == 'supplier' %}active{% endif %}" href="/supplier">Supplier Report</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if active == 'framework' %}active{% endif %}" href="/framework">Framework Report</a>
        </li>
      </ul>
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link text-secondary" href="/logout">Sign out</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<main class="container-fluid py-4 px-4">
  {% block content %}{% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
